name: Publish newsletter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build only public files
        run: |
          node --test
          node .github/scripts/send_telegram.mjs --dry-run
          node scripts/build.mjs
          node scripts/check-site.mjs
          node scripts/editorial-check.mjs
      - name: Preserve published correction history
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/check-history.mjs "$BASE_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Deliver changed edition after deployment
        if: github.event_name == 'push'
        env:
          DELIVERY_BASE_SHA: ${{ github.event.before }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: node .github/scripts/send_telegram.mjs

