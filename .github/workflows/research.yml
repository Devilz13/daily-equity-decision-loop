name: Equity research
on:
  push:
    branches: [main]
    paths: ['.github/workflows/research.yml']
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Up to 10 tickers, comma or space separated'
        required: true
        default: 'AAPL,NVDA'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tools/ai-trade-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python -m pip install 'yfinance>=0.2.65,<2'
      - env:
          TICKERS: ${{ inputs.tickers || 'AAPL' }}
        run: python research.py --tickers="$TICKERS"
      - name: Verify fresh provider response on workflow changes
        if: github.event_name == 'push'
        run: |
          python - <<'PYTHON'
          import json
          row, = json.load(open("research-output/snapshot.json"))
          if (row["ticker"] != "AAPL" or not row.get("last_daily_bar_date")
              or not row.get("last_daily_bar_close")
              or not row["fundamentals"].get("revenue_ttm")):
              raise SystemExit("AAPL smoke check did not return a dated price and revenue.")
          print("AAPL provider smoke test passed:", row["last_daily_bar_date"])
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equity-research
          path: tools/ai-trade-research/research-output/
          retention-days: 3
