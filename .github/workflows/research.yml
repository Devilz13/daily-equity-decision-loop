name: Equity research
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Up to 10 tickers, comma or space separated'
        required: true
        default: 'AAPL,NVDA'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tools/ai-trade-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python -m pip install 'yfinance>=0.2.65,<2'
      - env:
          TICKERS: ${{ inputs.tickers }}
        run: python research.py --tickers="$TICKERS"
      - uses: actions/upload-artifact@v4
        with:
          name: equity-research
          path: tools/ai-trade-research/research-output/
          retention-days: 3
